name: Deploy to Heroku

on:
  push:
    branches: [ main ]

jobs:
  deploy-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Login to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git config --global user.email "032018giahuy@gmail.com"
          git config --global user.name "Luu Gia Huy"
          cat << EOF > ~/.netrc
          machine api.heroku.com
            login 032018giahuy@gmail.com
            password $HEROKU_API_KEY
          machine git.heroku.com
            login 032018giahuy@gmail.com
            password $HEROKU_API_KEY
          EOF
          heroku login -s

      - name: Deploy User Service
        run: |
          heroku git:remote -a huy2026-user-service -r heroku-user
          git subtree push --prefix user-service heroku-user main

      - name: Deploy Product Service
        run: |
          heroku git:remote -a huy2026-product-service -r heroku-product
          git subtree push --prefix product-service heroku-product main

      - name: Deploy Order Service
        run: |
          heroku git:remote -a huy2026-order-service -r heroku-order
          git subtree push --prefix order-service heroku-order main

      - name: Deploy API Gateway
        run: |
          heroku git:remote -a huy2026-api-gateway -r heroku-gateway
          git subtree push --prefix api-gateway heroku-gateway main