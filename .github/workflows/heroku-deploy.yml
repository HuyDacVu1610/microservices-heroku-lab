name: Deploy to Heroku

on:
  push:
    branches: [ main ]

jobs:
  deploy-user-service:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Heroku CLI
      run: npm install -g heroku
    - uses: akhileshns/heroku-deploy@v3.12.12
      with:
        heroku_api_key: ${{secrets.HEROKU_API_KEY}}
        heroku_app_name: "huy2026-user-service"
        heroku_email: "032018giahuy@gmail.com"
        appdir: "user-service"

  deploy-product-service:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Heroku CLI
      run: npm install -g heroku
    - uses: akhileshns/heroku-deploy@v3.12.12
      with:
        heroku_api_key: ${{secrets.HEROKU_API_KEY}}
        heroku_app_name: "huy2026-product-service"
        heroku_email: "032018giahuy@gmail.com"
        appdir: "product-service"

  deploy-order-service:
    runs-on: ubuntu-latest
    needs: [deploy-user-service, deploy-product-service]
    steps:
    - uses: actions/checkout@v4
    - name: Install Heroku CLI
      run: npm install -g heroku
    - uses: akhileshns/heroku-deploy@v3.12.12
      with:
        heroku_api_key: ${{secrets.HEROKU_API_KEY}}
        heroku_app_name: "huy2026-order-service"
        heroku_email: "032018giahuy@gmail.com"
        appdir: "order-service"

  deploy-api-gateway:
    runs-on: ubuntu-latest
    needs: [deploy-user-service, deploy-product-service, deploy-order-service]
    steps:
    - uses: actions/checkout@v4
    - name: Install Heroku CLI
      run: npm install -g heroku
    - uses: akhileshns/heroku-deploy@v3.12.12
      with:
        heroku_api_key: ${{secrets.HEROKU_API_KEY}}
        heroku_app_name: "huy2026-api-gateway"
        heroku_email: "032018giahuy@gmail.com"
        appdir: "api-gateway"